name: honegumi_rag_assistant
channels:
  - defaults
  - conda-forge
  - pytorch
  # - fastai
dependencies:
  - python==3.11
  - pip
  # BASICS
  - numpy==2.3.3
  - scipy
  - pandas==2.3.3
  - tqdm
  - click
  - ipython
  # VISUALIZATION
  - matplotlib
  - ipympl  # interactive matplotlib plots
  - seaborn
  # - altair
  # - yellowbrick
  # ML, STATS & DEEP LEARNING
  # - statsmodels
  # - scikit-learn
  # - sktime
  # - tslearn
  # - xgboost
  # - catboost
  # - lightgbm
  # - pytorch
  # - fastai  # activate fastai channel above!
  # - tensorflow
  # - keras
  # - spacy
  # OTHER TOOLS
  # - optuna
  # - dask
  # - snakeviz
  - pip:
     - -e .  # install git checkout of honegumi_rag_assistant in editable mode
     # add here only pip-packages that are not available in conda/conda-forge! E.g.:
     # - icecream
     # - jax
     # - numpyro
     # - funsor
     # - neptune-client
     # - neptune-contrib
     # LLM: Anthropic Claude via the LangChain 1.x integration package
     - anthropic==0.120.0
     - langchain-anthropic==1.5.2
     - langchain-core==1.5.1
     - langgraph==1.2.9
     # Skeleton generation. honegumi only requires ax-platform<1, so Ax is
     # pinned explicitly here to match the version the vector store and the
     # generated scripts target.
     - honegumi==0.4.3
     - ax-platform==0.4.3
     # RAG: local sentence-transformers embeddings + FAISS
     - langchain-community==0.4.2
     - langchain-text-splitters==1.1.2
     - langchain-huggingface==1.2.2
     - sentence-transformers==5.6.1
     - faiss-cpu==1.14.3

  # DEVELOPMENT ONLY PACKAGES (could also be kept in a separate environment file)
  - jupyterlab
  - pytest
  - pytest-cov
  - tox
  - pre_commit
  - nbdime
  - nbstripout
  - sphinx
  - recommonmark
